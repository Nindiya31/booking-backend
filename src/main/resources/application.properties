spring.application.name=booking-backend

# --- Database (Phase 2: MySQL, managed by Flyway) ---
# Dedicated low-privilege app user (created in MySQL Workbench), scoped to only
# the booking_app schema -- not root. Override with env vars DB_USERNAME /
# DB_PASSWORD instead of editing this file if you'd rather use your own user.
spring.datasource.url=jdbc:mysql://localhost:3306/booking_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:booking_app}
spring.datasource.password=${DB_PASSWORD:6GnKfTxQDPZZfFRCw4qX}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema; Hibernate only validates entities against it so the
# two can never silently drift apart.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
